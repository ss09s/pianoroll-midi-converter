<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PianoRoll MIDI Converter v0.2</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:14px;background:#f3f5f9;color:#18202b}.wrap{max-width:1050px;margin:auto}.box{background:white;border:1px solid #dce2eb;border-radius:12px;padding:14px;margin:12px 0}video,canvas{width:100%;max-height:440px;background:#111;border-radius:8px}canvas{height:auto;border:1px solid #ddd}button{padding:10px 14px;border:0;border-radius:8px;background:#245bd6;color:white;margin:4px;min-height:42px}button:disabled{opacity:.4}input{padding:8px;max-width:100%}.status{white-space:pre-wrap;background:#edf3ff;padding:10px;border-radius:8px;margin-top:8px}.muted{color:#647086;font-size:.9rem}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}label{margin:5px}
</style></head><body><main class="wrap"><h1>PianoRoll MIDI Converter <small>Ver.0.2</small></h1><p class="muted">動画・画像解析を端末内で行う試作版です。</p>
<section class="box"><h2>1. 動画を読み込む</h2><input id="file" type="file" accept="video/*"><div id="status" class="status" aria-live="polite">動画ファイルを選択してください。</div><video id="v" controls playsinline></video>
<div class="row"><button id="prev" disabled>−1フレーム</button><button id="next" disabled>＋1フレーム</button><label>時刻(秒) <input id="t" type="number" min="0" step=".01" value="0"></label><button id="seek" disabled>移動</button></div></section>
<section class="box"><h2>2. 鍵盤領域の検出</h2><p class="muted">鍵盤が見えるフレームに移動し、上下位置を調整して検出してください。</p><div class="row"><label>上端% <input id="top" type="number" min="0" max="100" value="72"></label><label>下端% <input id="bottom" type="number" min="0" max="100" value="98"></label><button id="key" disabled>鍵盤境界を検出</button><button id="clear" disabled>クリア</button></div><canvas id="cv" width="960" height="540"></canvas><div id="keyresult" class="status">未検出</div></section>
<section class="box"><h2>3. ノーツ候補の抽出（試験機能）</h2><p class="muted">色のある縦長領域を候補表示します。背景エフェクトも含まれるため、まだMIDI変換には使用しません。</p><div class="row"><label>最小高さ(px) <input id="minh" type="number" min="3" max="300" value="12"></label><button id="notes" disabled>ノーツ候補を検出</button></div><div id="noteresult" class="status">動画を読み込んでください。</div></section><canvas id="work" hidden></canvas></main>
<script>
(()=>{const $=id=>document.getElementById(id),v=$('v'),cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),work=$('work'),wx=work.getContext('2d',{willReadFrequently:true});let url=null,ready=false,lines=[],boxes=[];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,Number.isFinite(n)?n:a));
function status(s){$('status').textContent=s}
function draw(){if(!ready||!v.videoWidth)return;let r=Math.min(960/v.videoWidth,540/v.videoHeight);cv.width=Math.round(v.videoWidth*r);cv.height=Math.round(v.videoHeight*r);ctx.drawImage(v,0,0,cv.width,cv.height);let y1=cv.height*clamp(+$('top').value,0,100)/100,y2=cv.height*clamp(+$('bottom').value,0,100)/100;ctx.strokeStyle='#20c879';ctx.lineWidth=2;ctx.strokeRect(0,y1,cv.width,y2-y1);lines.forEach(x=>{ctx.strokeStyle='#ff5555';ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke()});boxes.forEach(b=>{ctx.strokeStyle='#ffd34d';ctx.strokeRect(b.x,b.y,b.w,b.h)});$('t').value=v.currentTime.toFixed(2)}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;ready=false;status('動画を読み込み中…');v.onloadedmetadata=()=>{ready=true;['prev','next','seek','key','clear','notes'].forEach(id=>$(id).disabled=false);draw();status(`読み込み完了：${v.videoWidth}×${v.videoHeight} / ${v.duration.toFixed(2)}秒。動画の再生・シークで解析フレームを選べます。`)};v.onerror=()=>status('読み込み失敗。ブラウザで再生できる動画形式を選んでください。')};
v.onseeked=draw;v.ontimeupdate=()=>{if(v.paused)draw()};$('prev').onclick=()=>v.currentTime=Math.max(0,v.currentTime-1/30);$('next').onclick=()=>v.currentTime=Math.min(v.duration,v.currentTime+1/30);$('seek').onclick=()=>v.currentTime=clamp(+$('t').value,0,v.duration);$('top').onchange=draw;$('bottom').onchange=draw;
$('key').onclick=()=>{draw();let W=cv.width,H=cv.height,y1=Math.round(H*clamp(+$('top').value,0,100)/100),y2=Math.round(H*clamp(+$('bottom').value,0,100)/100),im=ctx.getImageData(0,y1,W,Math.max(1,y2-y1)).data,scores=new Float32Array(W);for(let x=1;x<W;x++){let s=0,n=0,step=Math.max(1,Math.floor((y2-y1)/70));for(let y=0;y<y2-y1;y+=step){let a=(y*W+x)*4,b=(y*W+x-1)*4;s+=Math.abs(im[a]-im[b])+Math.abs(im[a+1]-im[b+1])+Math.abs(im[a+2]-im[b+2]);n++}scores[x]=s/Math.max(1,n)}let avg=scores.reduce((a,b)=>a+b,0)/W,th=Math.max(18,avg*1.5);lines=[];let last=-99;for(let x=2;x<W-2;x++)if(scores[x]>th&&scores[x]>=scores[x-1]&&scores[x]>=scores[x+1]&&x-last>5){lines.push(x);last=x}draw();$('keyresult').textContent=`境界候補 ${lines.length}本 / 区間候補 ${Math.max(0,lines.length-1)}個（赤線）\n簡易検出のため、背景や黒鍵で誤検出する場合があります。`};
$('clear').onclick=()=>{lines=[];boxes=[];draw();$('keyresult').textContent='クリアしました。';$('noteresult').textContent='クリアしました。'};
$('notes').onclick=()=>{draw();let W=cv.width,H=cv.height,ye=Math.round(H*clamp(+$('top').value,0,100)/100);work.width=W;work.height=H;wx.drawImage(v,0,0,W,H);let d=wx.getImageData(0,0,W,ye).data,seen=new Uint8Array(W*ye),found=[],mh=clamp(+$('minh').value,3,300);function active(x,y){let i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx>95&&mx-mn>35}for(let y=0;y<ye;y+=2)for(let x=0;x<W;x+=2){let id=y*W+x;if(seen[id]||!active(x,y))continue;let q=[[x,y]],x0=x,x1=x,y0=y,y1=y,count=0;seen[id]=1;while(q.length){let [a,b]=q.pop();count++;x0=Math.min(x0,a);x1=Math.max(x1,a);y0=Math.min(y0,b);y1=Math.max(y1,b);for(let [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2]]){let nx=a+dx,ny=b+dy;if(nx<0||nx>=W||ny<0||ny>=ye)continue;let ni=ny*W+nx;if(!seen[ni]&&active(nx,ny)){seen[ni]=1;q.push([nx,ny])}}}let bw=x1-x0+1,bh=y1-y0+1;if(bh>=mh&&bw>=3&&bh>bw*.7&&count>8)found.push({x:x0,y:y0,w:bw,h:bh})}boxes=found.slice(0,250);draw();$('noteresult').textContent=`候補 ${found.length} 個（黄色枠）。\n色領域の抽出段階であり、音程・発音時刻・ノーツ長はまだ確定していません。`};
})();
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PianoRoll MIDI Converter v0.3</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;padding:14px;background:#f3f5f9;color:#18202b}.wrap{max-width:1050px;margin:auto}.box{background:white;border:1px solid #dce2eb;border-radius:12px;padding:14px;margin:12px 0}video,canvas{width:100%;max-height:440px;background:#111;border-radius:8px}canvas{height:auto;border:1px solid #ddd}button{padding:9px 13px;border:0;border-radius:8px;background:#245bd6;color:white;margin:3px;min-height:42px}button.secondary{background:#e9eef8;color:#23324b}button:disabled{opacity:.4}input{padding:8px;width:78px}.status{white-space:pre-wrap;background:#edf3ff;padding:10px;border-radius:8px;margin-top:8px}.muted{color:#647086;font-size:.9rem}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.stepper{display:inline-flex;align-items:center;gap:3px}.stepper button{min-width:42px;padding:6px}.stepper output{min-width:48px;text-align:center;font-weight:700}
</style></head><body><main class="wrap"><h1>PianoRoll MIDI Converter <small>Ver.0.3</small></h1><p class="muted">動画・画像解析を端末内で行います。</p>
<section class="box"><h2>1. 動画を読み込む</h2><input id="file" type="file" accept="video/*"><div id="status" class="status" aria-live="polite">動画ファイルを選択してください。</div><video id="v" controls playsinline></video><div class="row"><button id="prev" disabled>−1フレーム</button><button id="next" disabled>＋1フレーム</button><label>時刻(秒) <input id="t" type="number" min="0" step=".01" value="0"></label><button id="seek" disabled>移動</button></div></section>
<section class="box"><h2>2. 鍵盤領域の検出</h2><p class="muted">上下端をボタンで1%ずつ調整できます。</p><div class="row"><label>上端 <span class="stepper"><button class="secondary" id="topMinus" disabled>−</button><output id="topVal">72%</output><button class="secondary" id="topPlus" disabled>＋</button></span></label><label>下端 <span class="stepper"><button class="secondary" id="bottomMinus" disabled>−</button><output id="bottomVal">98%</output><button class="secondary" id="bottomPlus" disabled>＋</button></span></label><button id="key" disabled>鍵盤境界を検出</button><button id="clear" class="secondary" disabled>クリア</button></div><canvas id="cv" width="960" height="540"></canvas><div id="keyresult" class="status">未検出</div></section>
<section class="box"><h2>3. ノーツ候補の抽出（改善版・試験機能）</h2><p class="muted">色の彩度・縦横比・幅・高さに加え、前後フレームでも同じ横位置に候補があるか確認します。</p><div class="row"><label>最小高さ(px) <input id="minh" type="number" min="3" max="300" value="14"></label><label>最大幅(px) <input id="maxw" type="number" min="3" max="300" value="90"></label><button id="notes" disabled>ノーツ候補を検出</button></div><div id="noteresult" class="status">動画を読み込んでください。</div></section><canvas id="source" hidden></canvas></main>
<script>
(()=>{
const $=id=>document.getElementById(id),v=$('v'),cv=$('cv'),ctx=cv.getContext('2d'),src=$('source'),sx=src.getContext('2d',{willReadFrequently:true});
let url=null,ready=false,lines=[],boxes=[],busy=false;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,Number.isFinite(n)?n:a)),top=()=>+$('topVal').textContent.replace('%',''),bottom=()=>+$('bottomVal').textContent.replace('%','');
function status(s){$('status').textContent=s}
function frame(){if(!ready||!v.videoWidth)return;let r=Math.min(960/v.videoWidth,540/v.videoHeight),W=Math.round(v.videoWidth*r),H=Math.round(v.videoHeight*r);src.width=cv.width=W;src.height=cv.height=H;sx.drawImage(v,0,0,W,H);ctx.clearRect(0,0,W,H);ctx.drawImage(src,0,0);let y1=H*top()/100,y2=H*bottom()/100;ctx.strokeStyle='#20c879';ctx.lineWidth=2;ctx.strokeRect(0,y1,W,y2-y1);lines.forEach(x=>{ctx.strokeStyle='#ff5555';ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke()});boxes.forEach(b=>{ctx.strokeStyle='#ffd34d';ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h)});$('t').value=v.currentTime.toFixed(2)}
function setPct(which,val){val=clamp(val,0,100);if(which==='top')val=Math.min(val,bottom()-1);else val=Math.max(val,top()+1);$(which+'Val').textContent=val+'%';frame()}
function enable(){['prev','next','seek','key','clear','notes','topMinus','topPlus','bottomMinus','bottomPlus'].forEach(id=>$(id).disabled=false)}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;ready=false;status('動画を読み込み中…');v.onloadedmetadata=()=>{ready=true;enable();frame();status(`読み込み完了：${v.videoWidth}×${v.videoHeight} / ${v.duration.toFixed(2)}秒`)};v.onerror=()=>status('読み込み失敗。ブラウザで再生できる動画形式を選んでください。')};
v.onseeked=frame;v.ontimeupdate=()=>{if(v.paused)frame()};$('prev').onclick=()=>v.currentTime=Math.max(0,v.currentTime-1/30);$('next').onclick=()=>v.currentTime=Math.min(v.duration,v.currentTime+1/30);$('seek').onclick=()=>v.currentTime=clamp(+$('t').value,0,v.duration);
$('topMinus').onclick=()=>setPct('top',top()-1);$('topPlus').onclick=()=>setPct('top',top()+1);$('bottomMinus').onclick=()=>setPct('bottom',bottom()-1);$('bottomPlus').onclick=()=>setPct('bottom',bottom()+1);
$('key').onclick=()=>{if(!ready)return;const W=src.width,H=src.height,y1=Math.round(H*top()/100),y2=Math.round(H*bottom()/100),im=sx.getImageData(0,y1,W,Math.max(1,y2-y1)).data;let scores=new Float32Array(W);for(let x=1;x<W;x++){let sum=0,n=0,step=Math.max(1,Math.floor((y2-y1)/80));for(let y=0;y<y2-y1;y+=step){let a=(y*W+x)*4,b=(y*W+x-1)*4;sum+=Math.abs(im[a]-im[b])+Math.abs(im[a+1]-im[b+1])+Math.abs(im[a+2]-im[b+2]);n++}scores[x]=sum/Math.max(1,n)}let avg=0;for(let x=1;x<W;x++)avg+=scores[x];avg/=Math.max(1,W-1);let threshold=Math.max(18,avg*1.5),found=[],last=-99;for(let x=2;x<W-2;x++)if(scores[x]>threshold&&scores[x]>=scores[x-1]&&scores[x]>=scores[x+1]&&x-last>5){found.push(x);last=x}lines=found;boxes=[];frame();$('keyresult').textContent=`境界候補：${lines.length}本\n区間候補：約${Math.max(0,lines.length-1)}個\n※再検出時は前回結果を置き換えます。`};
$('clear').onclick=()=>{lines=[];boxes=[];frame();$('keyresult').textContent='検出結果をクリアしました。';$('noteresult').textContent='検出結果をクリアしました。'};
function seekTo(t){return new Promise(resolve=>{if(Math.abs(v.currentTime-t)<.005){resolve();return}const done=()=>{v.removeEventListener('seeked',done);resolve()};v.addEventListener('seeked',done);v.currentTime=t})}
async function componentsAt(t,W,H,yEnd,minH,maxW){await seekTo(t);sx.drawImage(v,0,0,W,H);let d=sx.getImageData(0,0,W,yEnd).data,seen=new Uint8Array(W*yEnd),out=[];const pix=(x,y)=>{let i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?((mx-mn)/mx):0;return mx>105&&sat>.38&&mx-mn>48};for(let y=0;y<yEnd;y+=2)for(let x=0;x<W;x+=2){let id=y*W+x;if(seen[id]||!pix(x,y))continue;let q=[[x,y]],x0=x,x1=x,y0=y,y1=y,count=0;seen[id]=1;while(q.length){let [a,b]=q.pop();count++;x0=Math.min(x0,a);x1=Math.max(x1,a);y0=Math.min(y0,b);y1=Math.max(y1,b);for(let [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2]]){let nx=a+dx,ny=b+dy;if(nx<0||nx>=W||ny<0||ny>=yEnd)continue;let ni=ny*W+nx;if(!seen[ni]&&pix(nx,ny)){seen[ni]=1;q.push([nx,ny])}}}let bw=x1-x0+1,bh=y1-y0+1,area=count*4;if(bh>=minH&&bw>=3&&bw<=maxW&&bh/bw>=1.15&&area>=18&&bh<yEnd*.85)out.push({x:x0,y:y0,w:bw,h:bh})}return out}
$('notes').onclick=async()=>{if(!ready||busy)return;busy=true;$('notes').disabled=true;$('noteresult').textContent='前後フレームを確認中…';let original=v.currentTime,W=src.width,H=src.height,yEnd=Math.round(H*top()/100),minH=clamp(+$('minh').value,3,300),maxW=clamp(+$('maxw').value,3,300),dt=.08;try{let sets=[];for(let t of [Math.max(0,original-dt),original,Math.min(v.duration,original+dt)])sets.push(await componentsAt(t,W,H,yEnd,minH,maxW));let center=sets[1],near=[...sets[0],...sets[2]];boxes=center.filter(b=>near.some(n=>{let overlap=Math.max(0,Math.min(b.x+b.w,n.x+n.w)-Math.max(b.x,n.x));return overlap/Math.max(1,Math.min(b.w,n.w))>=.55&&Math.abs(b.w-n.w)<=Math.max(8,b.w*.65)}));await seekTo(original);frame();$('noteresult').textContent=`中央フレーム候補：${center.length}個\n前後フレームでも横位置・幅が一致：${boxes.length}個（黄色枠）\n一時的な光や粒子状エフェクトを減らしますが、持続する背景模様は残る可能性があります。`}catch(e){$('noteresult').textContent='解析中にエラーが発生しました。動画を読み込み直して再試行してください。';await seekTo(original);frame()}finally{busy=false;$('notes').disabled=false}};
})();
</script></main></body></html>
